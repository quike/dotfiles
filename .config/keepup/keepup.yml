version: 2
settings:
  logging:
    level: debug
    pretty: true
  working-dir: /tmp
  max-concurrency: 2
groups:
  - name: brew-update
    command: brew
    params:
      - update
    description: Execute brew update
  - name: brew-upgrade
    command: brew
    params:
      - upgrade
    description: Execute brew upgrade
  - name: brew-cleanup
    command: brew
    params:
      - cleanup
    description: Execute brew cleanup
  - name: omf-update
    command: omf
    params:
      - update
    shell: /opt/homebrew/bin/fish
    description: Update Oh My Fish
  - name: omf-reload
    command: omf
    params:
      - reload
    shell: /opt/homebrew/bin/fish
    description: Reload Oh My Fish
  - name: fisher-update
    command: fisher
    params:
      - update
    shell: /opt/homebrew/bin/fish
    description: Update Fisher
default: main
flows:
  main:
    description: Migrated from v1 execution
    mode: step
    steps:
      - run:
          - brew-update
      - run:
          - brew-upgrade
      - run:
          - brew-cleanup
      - run:
          - omf-update
          - fisher-update
      - run:
          - omf-reload
